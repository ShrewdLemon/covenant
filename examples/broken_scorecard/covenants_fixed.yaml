# The scorecard's covenants, with reason codes derived from the live model.
covenant_schema: 1
model_name: demo-scorecard
features:
  - name: income
    dtype: numeric
    direction: decreases_risk
  - name: dti
    dtype: numeric
    direction: increases_risk
  - name: utilization
    dtype: numeric
    direction: increases_risk
  - name: delinquencies_24m
    dtype: numeric
    direction: increases_risk
  - name: inquiries_6m
    dtype: numeric
    direction: increases_risk
  - name: age_of_oldest_line_months
    dtype: numeric
    direction: decreases_risk
  - name: loan_amount
    dtype: numeric
    direction: increases_risk
  - name: employment_years
    dtype: numeric
    direction: decreases_risk
excluded:
  - name: gender
    reason: protected attribute (ECOA / not collected)
reason_codes:
  method: difference_from_mean
  top_k: 4
  parameters:
    coefficients: coefficients_live.csv
checks:
  reason_codes:
    min_top1_agreement: 0.75
    min_topk_jaccard: 0.60
    decision_threshold: 0.5
    max_denied_sample: 120
    background_size: 60
  features:
    sample_size: 200
    background_size: 60
  exclusions:
    max_association: 0.5
    sample_size: 200
    background_size: 60
report:
  target_column: bad
  time_column: application_month
  n_bootstrap: 300
