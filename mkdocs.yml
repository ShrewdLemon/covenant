site_name: Covenant
site_description: "pytest for credit-model governance: a model's documentation is a set of testable claims about its behaviour, so test them."
site_url: https://shrewdlemon.github.io/covenant/
repo_url: https://github.com/ShrewdLemon/covenant
repo_name: ShrewdLemon/covenant

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - content.code.copy

nav:
  - Home: index.md
  - Regulatory mapping: MAPPING.md
  - Research guide: research-guide.md

markdown_extensions:
  - admonition
  - tables
  - pymdownx.superfences
