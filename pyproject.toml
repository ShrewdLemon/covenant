[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "covenants"
version = "0.2.0"
description = "pytest for credit-model governance: a model's documentation is a set of testable claims about its behaviour, so test them."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Punarbasu", email = "punarbasuu@gmail.com" }]
keywords = [
    "model-risk",
    "credit-risk",
    "governance",
    "validation",
    "adverse-action",
    "explainability",
    "SR 26-2",
    "FREE-AI",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "shap>=0.45",
    "pydantic[email]>=2.6",
    "ruamel.yaml>=0.18",
    "typer>=0.12",
    "joblib>=1.3",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
]

[project.scripts]
covenant = "covenant.cli:app"

[project.urls]
Homepage = "https://github.com/ShrewdLemon/covenant"
Issues = "https://github.com/ShrewdLemon/covenant/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/covenant"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# typer declares CLI parameters via function-call defaults by design
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: long-running performance tests",
]
