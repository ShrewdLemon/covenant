name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          uv pip install -e ".[dev]"
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Lint
        run: ruff check src tests examples
      - name: Tests
        run: pytest -q

  demo:
    # The README's central claim, asserted on every commit: the broken
    # scorecard breaches (exit 1), the fixed one passes (exit 0).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          uv pip install -e .
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Build demo artifacts
        run: python examples/broken_scorecard/make_demo.py
      - name: Broken scorecard must breach
        working-directory: examples/broken_scorecard
        run: |
          set +e
          covenant check reason-codes model.joblib train.csv --covenants covenants_broken.yaml
          code=$?
          set -e
          test "$code" -eq 1
      - name: Fixed scorecard must pass
        working-directory: examples/broken_scorecard
        run: covenant check reason-codes model.joblib train.csv --covenants covenants_fixed.yaml
      - name: Unconstrained GBM must breach monotonicity
        working-directory: examples/broken_scorecard
        run: |
          set +e
          covenant check monotonicity model_gbm_unconstrained.joblib train.csv --covenants covenants_gbm.yaml
          code=$?
          set -e
          test "$code" -eq 1
      - name: Constrained GBM must pass monotonicity
        working-directory: examples/broken_scorecard
        run: covenant check monotonicity model_gbm_constrained.joblib train.csv --covenants covenants_gbm.yaml
      - name: Checks 3 and 4 must pass on the clean scorecard
        working-directory: examples/broken_scorecard
        run: |
          covenant check features model.joblib train.csv --covenants covenants_fixed.yaml
          covenant check exclusions model.joblib train.csv --covenants covenants_fixed.yaml
      - name: Report renders byte-identically twice
        working-directory: examples/broken_scorecard
        run: |
          covenant report model.joblib train.csv --covenants covenants_fixed.yaml --governance governance.yaml --out report_a
          covenant report model.joblib train.csv --covenants covenants_fixed.yaml --governance governance.yaml --out report_b
          diff -r report_a report_b
      - name: Register and diff both versions
        working-directory: examples/broken_scorecard
        run: |
          covenant register model.joblib train.csv --covenants covenants_fixed.yaml --governance governance.yaml
          covenant register model.joblib train.csv --covenants covenants_broken.yaml --governance governance.yaml
          covenant list
      - name: Build German Credit demo (real public data, committed)
        working-directory: examples/german_credit
        run: python make_demo.py
      - name: Leaky model must breach features and exclusions
        working-directory: examples/german_credit
        run: |
          set +e
          covenant check features model_leaky.joblib train.csv --covenants covenants.yaml
          features=$?
          covenant check exclusions model_leaky.joblib train.csv --covenants covenants.yaml
          exclusions=$?
          set -e
          test "$features" -eq 1 && test "$exclusions" -eq 1
      - name: Clean model must pass every check
        working-directory: examples/german_credit
        run: covenant check all model_clean.joblib train.csv --covenants covenants.yaml
      - name: Real-data report renders byte-identically twice
        working-directory: examples/german_credit
        run: |
          covenant report model_clean.joblib train.csv --covenants covenants.yaml --governance governance.yaml --holdout holdout.csv --out report_a
          covenant report model_clean.joblib train.csv --covenants covenants.yaml --governance governance.yaml --holdout holdout.csv --out report_b
          diff -r report_a report_b
      - name: Taiwan demo — build, leaky breaches, clean passes, report byte-identical
        working-directory: examples/taiwan_credit
        run: |
          python make_demo.py
          set +e
          covenant check features model_leaky.joblib train.csv --covenants covenants.yaml
          features=$?
          covenant check exclusions model_leaky.joblib train.csv --covenants covenants.yaml
          exclusions=$?
          set -e
          test "$features" -eq 1 && test "$exclusions" -eq 1
          covenant check all model_clean.joblib train.csv --covenants covenants.yaml
          covenant report model_clean.joblib train.csv --covenants covenants.yaml --governance governance.yaml --holdout holdout.csv --out report_a
          covenant report model_clean.joblib train.csv --covenants covenants.yaml --governance governance.yaml --holdout holdout.csv --out report_b
          diff -r report_a report_b
      - name: HMDA demo — build, leaky breaches, clean passes, report byte-identical
        working-directory: examples/hmda_mortgage
        run: |
          python make_demo.py
          set +e
          covenant check features model_leaky.joblib train.csv --covenants covenants.yaml
          features=$?
          covenant check exclusions model_leaky.joblib train.csv --covenants covenants.yaml
          exclusions=$?
          set -e
          test "$features" -eq 1 && test "$exclusions" -eq 1
          covenant check all model_clean.joblib train.csv --covenants covenants.yaml
          covenant report model_clean.joblib train.csv --covenants covenants.yaml --governance governance.yaml --holdout holdout.csv --out report_a
          covenant report model_clean.joblib train.csv --covenants covenants.yaml --governance governance.yaml --holdout holdout.csv --out report_b
          diff -r report_a report_b

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          uv pip install -e ".[dev,integrations]"
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: mypy
        run: mypy src/covenant
      - name: Integration tests (optbinning, interpret, skops, boosters)
        run: pytest tests/test_integrations.py -q

  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Build site
        run: |
          uv pip install mkdocs-material
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          .venv/bin/mkdocs build --strict
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        id: deployment
        uses: actions/deploy-pages@v4
